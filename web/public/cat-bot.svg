<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <!-- Body Soft Gradient -->
    <linearGradient id="catBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0F2" />
    </linearGradient>

    <!-- Red Viettel Accent Gradient -->
    <linearGradient id="catRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A4B" />
      <stop offset="100%" stop-color="#EE0033" />
    </linearGradient>

    <!-- Visor Metallic Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17" />
      <stop offset="100%" stop-color="#1A0307" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Antenna at top -->
    <line x1="90" y1="5" x2="90" y2="25" stroke="#EE0033" stroke-width="4" stroke-linecap="round" />
    <circle cx="90" cy="5" r="7" fill="#FF4D6D" />

    <!-- Cat Ears -->
    <!-- Left Ear -->
    <path d="M 30 55 C 20 15, 60 20, 65 50 Z" fill="#FFFFFF" stroke="#EE0033" stroke-width="3.5" />
    <path d="M 38 52 C 30 28, 55 30, 58 48 Z" fill="url(#catRedGrad)" />

    <!-- Right Ear -->
    <path d="M 150 55 C 160 15, 120 20, 115 50 Z" fill="#FFFFFF" stroke="#EE0033" stroke-width="3.5" />
    <path d="M 142 52 C 150 28, 125 30, 122 48 Z" fill="url(#catRedGrad)" />

    <!-- Cat Head Outer Shell -->
    <rect x="25" y="35" width="130" height="110" rx="55" fill="url(#catBodyGrad)" stroke="#EE0033" stroke-width="4" />

    <!-- Helmet Visor -->
    <rect x="38" y="55" width="104" height="60" rx="30" fill="url(#visorGrad)" stroke="#FF4D6D" stroke-width="2" />

    <!-- Big Sparkling Cat Eyes -->
    <!-- Left Eye -->
    <circle cx="65" cy="85" r="18" fill="#1A0307" />
    <circle cx="65" cy="85" r="15" fill="#5E0D1C" />
    <circle cx="60" cy="78" r="6" fill="#FFFFFF" />
    <circle cx="70" cy="90" r="2.5" fill="#FFFFFF" />

    <!-- Right Eye -->
    <circle cx="115" cy="85" r="18" fill="#1A0307" />
    <circle cx="115" cy="85" r="15" fill="#5E0D1C" />
    <circle cx="110" cy="78" r="6" fill="#FFFFFF" />
    <circle cx="120" cy="90" r="2.5" fill="#FFFFFF" />

    <!-- Cute Nose & Smile -->
    <polygon points="88,95 92,95 90,98" fill="#FF4D6D" />
    <path d="M 83 99 Q 87 104 90 99 Q 93 104 97 99" fill="none" stroke="#FF4D6D" stroke-width="2.5" stroke-linecap="round" />

    <!-- Pink Cheeks -->
    <ellipse cx="42" cy="98" rx="7" ry="4" fill="#FF85A1" opacity="0.8" />
    <ellipse cx="138" cy="98" rx="7" ry="4" fill="#FF85A1" opacity="0.8" />

    <!-- Viettel AI Collar with Chat Badge -->
    <rect x="55" y="140" width="70" height="12" rx="6" fill="url(#catRedGrad)" />
    <circle cx="90" cy="155" r="14" fill="#FFFFFF" stroke="#EE0033" stroke-width="3" />
    <!-- Chat Icon inside badge -->
    <path d="M 84 151 C 84 148, 96 148, 96 151 C 96 156, 92 158, 90 161 C 88 158, 84 156, 84 151 Z" fill="#EE0033" />

    <!-- Waving Paw (Right Paw Waving Hello!) -->
    <g transform="translate(145, 115) rotate(-15)">
      <ellipse cx="18" cy="18" rx="16" ry="14" fill="url(#catBodyGrad)" stroke="#EE0033" stroke-width="3" />
      <circle cx="18" cy="18" r="6" fill="#FF4D6D" />
      <circle cx="9" cy="10" r="3" fill="#FF4D6D" />
      <circle cx="18" cy="7" r="3" fill="#FF4D6D" />
      <circle cx="27" cy="10" r="3" fill="#FF4D6D" />
    </g>
  </g>
</svg>
