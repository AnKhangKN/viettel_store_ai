<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Vibrant Viettel Gradient -->
    <linearGradient id="logoRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3355" />
      <stop offset="60%" stop-color="#EE0033" />
      <stop offset="100%" stop-color="#990022" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="logoGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <!-- 3D Geometric "V" Emblem with 5G Signal Arc -->
  <g>
    <!-- Left Wing of V (Bold Gradient Ribbon) -->
    <path
      d="M 25 30 Q 55 15, 80 60 L 105 170 Q 80 175, 65 155 L 15 60 Q 5 40, 25 30 Z"
      fill="url(#logoRedGrad)"
    />

    <!-- Right Wing of V (Interlocking Wing) -->
    <path
      d="M 105 170 Q 125 175, 145 150 L 185 60 Q 195 40, 175 30 Q 150 20, 125 70 L 105 170 Z"
      fill="url(#logoGoldGrad)"
    />

    <!-- 5G Signal Wave Arc (Top Right) -->
    <path
      d="M 155 35 A 35 35 0 0 1 190 5"
      fill="none"
      stroke="url(#logoRedGrad)"
      stroke-width="8"
      stroke-linecap="round"
    />

    <!-- AI Spark Node -->
    <circle cx="190" cy="5" r="5" fill="#FBBF24" />
  </g>
</svg>
