version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: viettel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: viettel_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: viettel_server
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://admin:123456@postgres:5432/viettel_db
      ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./server/data:/app/data:ro

volumes:
  postgres_data:
